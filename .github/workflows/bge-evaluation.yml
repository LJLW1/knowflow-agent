name: Local BGE evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen --extra embedding
      - run: uv run python scripts/build_demo_documents.py
      - run: uv run knowflow-eval --embedding bge --output reports/evaluation/bge-local.json
      - uses: actions/upload-artifact@v4
        with:
          name: bge-evaluation
          path: reports/evaluation/
