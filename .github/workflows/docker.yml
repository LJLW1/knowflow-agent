name: Docker

on:
  pull_request:
    paths:
      - Dockerfile
      - docker-compose.yml
      - pyproject.toml
      - uv.lock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: knowflow-agent:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Runtime health smoke
        run: |
          docker run --rm -d --name knowflow-smoke -p 8000:8000 knowflow-agent:test
          trap 'docker logs knowflow-smoke; docker stop knowflow-smoke' EXIT
          for attempt in {1..60}; do
            if curl --fail http://127.0.0.1:8000/healthz; then
              exit 0
            fi
            sleep 2
          done
          exit 1
