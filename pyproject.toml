[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "knowflow-agent"
version = "0.1.0"
description = "Enterprise document RAG and bounded workflow agent built as an independent Hermes Agent extension."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {file = "LICENSE"}
authors = [{name = "LI Jiale"}]
dependencies = [
  "alembic>=1.14,<2",
  "chromadb>=1.0,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "numpy>=2.0,<3",
  "openai>=1.60,<3",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pymupdf>=1.25,<2",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "rank-bm25>=0.2.2,<1",
  "sqlalchemy>=2.0,<3",
  "streamlit>=1.41,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
embedding = ["sentence-transformers>=3.3,<6"]
hermes = ["hermes-agent==0.18.2"]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
knowflow-api = "knowflow.api.app:run"
knowflow-eval = "knowflow.evaluation.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/knowflow"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["knowflow"]

